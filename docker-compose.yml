version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: springtodo_postgres
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootroot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springtodo-net

  redis:
    image: redis:7-alpine
    container_name: springtodo_redis
    ports:
      - "6379:6379"
    networks:
      - springtodo-net

  app:
    build: .
    container_name: springtodo_app
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: rootroot
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - springtodo-net

volumes:
  postgres_data:

networks:
  springtodo-net:
